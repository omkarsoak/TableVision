# Granite Vision 4.1, LoRA/DoRA on the language model, output = the <table> only.
# First (baseline) fine-tune, as in the `lang_table_only`: 5,000 images, grad-accum 4, generic prompt.
# ~2.5 h training + 500-image inference on one GPU.
modules:
  - module: granite_vision_finetune
    run: true
    params:
      model_name: "ibm-granite/granite-vision-4.1-4b"
      dataset: "apoidea/pubtabnet-html"
      prompt: "Convert user's image to HTML"
      max_seq_length: 1024
      gradient_accumulation_steps: 4
      num_train_images: 5000
      num_test_images: 250
      layers_to_tune: ["language_model"]
      experiment_name: "lang_table_only"
      eval_steps: 125      # 1,250 optimizer steps -> 10 evaluations
      save_steps: 250
      use_wandb: false

  - module: inference
    run: true
    params:
      model_name: "ibm-granite/granite-vision-4.1-4b"
      adapter: "lang_table_only"
      dataset: "apoidea/pubtabnet-html"
      prompt: "Convert user's image to HTML"
      num_test_images: 500
      batch_size: 8
      results_path: "data/evaluation/results_lang_table_only.jsonl"
